name: Apply SAP stock UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: node scripts/apply_sap_stock_ui.mjs

      - name: Remove temporary patch files
        run: rm -f scripts/apply_sap_stock_ui.mjs .github/workflows/apply-sap-stock-ui.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/apply_sap_stock_ui.mjs .github/workflows/apply-sap-stock-ui.yml
          git commit -m "Add SAP stock tab and article stock details"
          git push origin main
