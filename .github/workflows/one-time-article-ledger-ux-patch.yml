name: One-time Article Ledger UX patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Automated Article Ledger UX patch')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Article Ledger UX
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # General article list: recently created records first, then the
          # existing month/description ordering as a deterministic fallback.
          replace_once(
              'src/components/Catalog.jsx',
              """      .sort((a, b) => {\n        // Newest manufacturing/import month first. For products in the same\n        // month, use created_at so newly added articles appear first.\n        const dateDiff = getDateKey(b) - getDateKey(a);\n        if (dateDiff !== 0) return dateDiff;\n\n        const createdA = a.created_at ? new Date(a.created_at).getTime() : 0;\n        const createdB = b.created_at ? new Date(b.created_at).getTime() : 0;\n        if (createdB !== createdA) return createdB - createdA;\n\n        // Stable final tie-breaker so the order doesn't appear random.\n        return String(a.description || a.model || a.ean || '').localeCompare(\n          String(b.description || b.model || b.ean || '')\n        );\n      });""",
              """      .sort((a, b) => {\n        // Recently added articles always appear first. Manufacturing/import\n        // month remains the fallback for legacy rows without created_at.\n        const createdA = a.created_at ? new Date(a.created_at).getTime() : 0;\n        const createdB = b.created_at ? new Date(b.created_at).getTime() : 0;\n        if (createdB !== createdA) return createdB - createdA;\n\n        const dateDiff = getDateKey(b) - getDateKey(a);\n        if (dateDiff !== 0) return dateDiff;\n\n        return String(a.description || a.model || a.ean || '').localeCompare(\n          String(b.description || b.model || b.ean || '')\n        );\n      });"""
          )

          # Garments: retain the newest row timestamp at group level and sort
          # groups by that timestamp so the newest style appears first.
          replace_once(
              'src/components/Garments.jsx',
              """        sizes: [],\n      });""",
              """        sizes: [],\n        created_at_ms: r.created_at ? new Date(r.created_at).getTime() : 0,\n      });"""
          )
          replace_once(
              'src/components/Garments.jsx',
              """    if (!g.image_url && r.image_url) g.image_url = r.image_url;\n    g.sizes.push(r);""",
              """    if (!g.image_url && r.image_url) g.image_url = r.image_url;\n    const rowCreatedAt = r.created_at ? new Date(r.created_at).getTime() : 0;\n    if (rowCreatedAt > (g.created_at_ms || 0)) g.created_at_ms = rowCreatedAt;\n    g.sizes.push(r);"""
          )
          replace_once(
              'src/components/Garments.jsx',
              """  const grouped = useMemo(() => groupGarments(garments), [garments]);""",
              """  const grouped = useMemo(() => (\n    groupGarments(garments).sort((a, b) => {\n      const createdDiff = (b.created_at_ms || 0) - (a.created_at_ms || 0);\n      if (createdDiff !== 0) return createdDiff;\n      return String(a.excel_name || a.model_name || '').localeCompare(String(b.excel_name || b.model_name || ''));\n    })\n  ), [garments]);"""
          )

          # Navigation: General -> Garments -> Add Product -> Showroom ->
          # Quotation Requests -> SAP Stock. Remove the retired AI Studio tab.
          replace_once(
              'src/App.jsx',
              """          {permissions.canViewGeneral && <button className={view === 'catalog' ? 'active' : ''} onClick={() => { setCatalogFilters(null); navigate('catalog'); }}>General</button>}\n          {permissions.canViewStock && <button className={view === 'stock' ? 'active' : ''} onClick={() => navigate('stock')}>SAP Stock</button>}\n          {permissions.canViewGarments && <button className={view === 'garments' ? 'active' : ''} onClick={() => { setGarmentFilters(null); navigate('garments'); }}>Garments</button>}\n          {permissions.canViewAddProduct && <button className={(view === 'add-product' || view === 'add-garment') ? 'active' : ''} onClick={openAddChoice}>+ Add Product</button>}\n          {permissions.canViewShowroom && <button className={view === 'showroom' ? 'active' : ''} onClick={() => navigate('showroom')}>Showroom</button>}\n          {permissions.canManageQuotations && <button className={view === 'showroom-orders' ? 'active' : ''} onClick={() => navigate('showroom-orders')}>Quotation Requests</button>}\n          {permissions.canEdit && <button className=\"ai-studio-tab\" onClick={() => setShowImageEnhancer(true)} title=\"Enhance catalogue product images with Gemini\">✨ AI Image Studio</button>}""",
              """          {permissions.canViewGeneral && <button className={view === 'catalog' ? 'active' : ''} onClick={() => { setCatalogFilters(null); navigate('catalog'); }}>General</button>}\n          {permissions.canViewGarments && <button className={view === 'garments' ? 'active' : ''} onClick={() => { setGarmentFilters(null); navigate('garments'); }}>Garments</button>}\n          {permissions.canViewAddProduct && <button className={(view === 'add-product' || view === 'add-garment') ? 'active' : ''} onClick={openAddChoice}>+ Add Product</button>}\n          {permissions.canViewShowroom && <button className={view === 'showroom' ? 'active' : ''} onClick={() => navigate('showroom')}>Showroom</button>}\n          {permissions.canManageQuotations && <button className={view === 'showroom-orders' ? 'active' : ''} onClick={() => navigate('showroom-orders')}>Quotation Requests</button>}\n          {permissions.canViewStock && <button className={view === 'stock' ? 'active' : ''} onClick={() => navigate('stock')}>SAP Stock</button>}"""
          )

          # Complete the earlier requested retirement of AI Image Studio.
          replace_once('src/App.jsx', "import ImageEnhancer from './components/ImageEnhancer.jsx';\n", '')
          replace_once('src/App.jsx', "  const [showImageEnhancer, setShowImageEnhancer] = useState(false);\n", '')
          replace_once(
              'src/App.jsx',
              """\n      {showImageEnhancer && (\n        <ImageEnhancer\n          products={products}\n          onClose={() => setShowImageEnhancer(false)}\n        />\n      )}\n""",
              '\n'
          )

          # Remove the now-unused AI tab CSS class if present in the main theme.
          theme = Path('src/styles/theme.css')
          if theme.exists():
              s = theme.read_text(encoding='utf-8')
              import re
              s2 = re.sub(r'\n?[^\n]*\.ai-studio-tab[^\n]*\n?', '\n', s)
              if s2 != s:
                  theme.write_text(s2, encoding='utf-8')

          print('Article Ledger UX patch completed')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Catalog.jsx src/components/Garments.jsx src/App.jsx src/styles/theme.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automated Article Ledger UX patch"
          git push
